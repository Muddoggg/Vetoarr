name: Cut GitHub release and publish Docker

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Tests and container security]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: vetoarr-release-cut
  cancel-in-progress: false

jobs:
  release:
    name: Release latest merged feature PR after CI
    # Only a successful post-merge push on main can trigger automatic releases.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release_output.outputs.release_tag }}
      pr_number: ${{ steps.release_output.outputs.pr_number }}
      head_sha: ${{ steps.release_output.outputs.head_sha }}
    steps:
      - name: Check out latest main and tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify main is current and ends with a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "::error::main moved since checkout; rerun the workflow."
            exit 1
          }

          # For automatic releases, don't release a newer main commit using an
          # older CI result. The newer commit will have its own post-merge CI.
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$HEAD_SHA" != "$CI_HEAD_SHA" ]]; then
            echo "::notice::main advanced since this CI run. Skipping stale release."
            echo "SKIP_RELEASE=1" >> "$GITHUB_ENV"
            exit 0
          fi

          # Require a real merged feature/* PR, not a direct push or PR from
          # another branch naming convention. Do not use untrusted PR code.
          PR_NUMBER="$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" |
            jq -r --arg sha "$HEAD_SHA" '[.[] | select(
              .merged_at != null and .base.ref == "main" and
              .merge_commit_sha == $sha and (.head.ref | startswith("feature/"))
            )] | .[0].number // empty')"

          if [[ -z "$PR_NUMBER" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
              echo "::notice::main HEAD is not a merged feature/* PR; no automatic release."
              echo "SKIP_RELEASE=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Only merged feature/* pull requests into main can be released."
            exit 1
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "Releasing merge commit $HEAD_SHA from PR #$PR_NUMBER"

      - name: Determine next version
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG="$(
            git tag --list |
            grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
            sort -V | tail -n 1 || true
          )"

          if [[ -z "$LAST_TAG" ]]; then
            echo "::error::No existing version tags found; bootstrap manually."
            exit 1
          fi

          LAST_SHA="$(git rev-list -n 1 "$LAST_TAG")"
          if [[ "$LAST_SHA" == "$HEAD_SHA" ]]; then
            if gh release view "$LAST_TAG" >/dev/null 2>&1; then
              if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
                echo "::notice::Commit already released as $LAST_TAG; ignoring duplicate CI."
                echo "SKIP_RELEASE=1" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "::error::The latest merged commit is already released as $LAST_TAG."
              exit 1
            fi
            # Recover a tag push that succeeded but failed to create a release.
            NEW_TAG="$LAST_TAG"
            echo "Recovering existing tag $NEW_TAG."
          else
            git merge-base --is-ancestor "$LAST_SHA" "$HEAD_SHA" || {
              echo "::error::Latest version tag is not an ancestor of main."
              exit 1
            }
            VERSION="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            # Custom base-10 rollover: 1.2.3 -> 1.2.4, 1.2.9 -> 1.3.0,
            # and 1.9.9 -> 2.0.0 (not conventional SemVer bump policy).
            if (( 10#$PATCH < 9 )); then
              NEW_TAG="v$MAJOR.$MINOR.$((10#$PATCH + 1))"
            elif (( 10#$MINOR < 9 )); then
              NEW_TAG="v$MAJOR.$((10#$MINOR + 1)).0"
            else
              NEW_TAG="v$((10#$MAJOR + 1)).0.0"
            fi
            if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
              echo "::error::Tag $NEW_TAG already exists."
              exit 1
            fi
          fi

          echo "RELEASE_TAG=$NEW_TAG" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Tag release commit
        if: env.SKIP_RELEASE != '1'
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Vetoarr $RELEASE_TAG (PR #$PR_NUMBER)"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             --verify-tag             --title "Vetoarr $RELEASE_TAG"             --generate-notes             --latest

      - name: Export release details
        if: env.SKIP_RELEASE != '1'
        id: release_output
        shell: bash
        run: |
          set -euo pipefail
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Dispatch GHCR image publication
    needs: release
    if: needs.release.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger GHCR Docker publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          PR_NUMBER: ${{ needs.release.outputs.pr_number }}
          HEAD_SHA: ${{ needs.release.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No valid release tag was provided by the release job."
            exit 1
          fi

          # This independent job can be retried without cutting another release.
          gh workflow run publish-ghcr.yml --ref main -f version="$RELEASE_TAG"
          {
            echo "## Vetoarr $RELEASE_TAG"
            echo ""
            echo "- Released merged PR #$PR_NUMBER at \`$HEAD_SHA\`"
            echo "- GitHub Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG"
            echo "- GHCR publishing dispatched for \`ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/vetoarr:${RELEASE_TAG#v}\`"
            echo "- Monitor the separate **Publish Vetoarr Docker image** workflow before deploying to Unraid."
          } >> "$GITHUB_STEP_SUMMARY"
